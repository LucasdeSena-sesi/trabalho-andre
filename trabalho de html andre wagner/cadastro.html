
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <section class="form-box">

            <h1>Criar conta</h1>
            <p class="subtitle">Preencha os dados para se cadastrar</p>

            <form action="#" method="post" data-tipo="cadastro">

                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email-cadastro">E-mail</label>
                    <input
                        type="email"
                        id="email-cadastro"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha-cadastro">Senha</label>
                    <input
                        type="password"
                        id="senha-cadastro"
                        name="senha"
                        placeholder="Crie uma senha"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <small>A senha deve ter pelo menos 8 caracteres.</small>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit">Cadastrar</button>

            </form>

            <p id="mensagem" class="mensagem" role="alert" aria-live="polite" hidden></p>

            <p class="switch-text">
                Já tem uma conta?
                <a href="index.html">Fazer login</a>
            </p>

        </section>
    </main>

</body>
</html>
